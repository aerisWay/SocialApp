# ============================================================
# docker-compose.yml — Levanta toda la aplicación con 1 clic
# ============================================================
# Servicios que arranca:
#   db       → PostgreSQL 16 (la base de datos)
#   backend  → FastAPI con hot-reload (tu API)

services:

  # ──────────────────────────────────────────
  # SERVICIO 1: Base de datos PostgreSQL
  # ──────────────────────────────────────────
  db:
    image: postgres:16-alpine          # Imagen oficial de PostgreSQL, versión ligera
    container_name: apbapp_db       # Nombre visible en Docker Desktop

    environment:
      POSTGRES_USER: apbapp_user       # Usuario de la BD
      POSTGRES_PASSWORD: apbapp_pass   # Contraseña (cámbiala en producción)
      POSTGRES_DB: apbapp_db           # Nombre de la base de datos

    volumes:
      # pgdata guarda los datos aunque apagues el contenedor
      - pgdata:/var/lib/postgresql/data

    ports:
      # Puerto 5432 accesible desde tu PC (útil para conectar con DBeaver/TablePlus)
      - "5432:5432"

    healthcheck:
      # Docker Desktop mostrará "healthy" cuando la BD esté lista
      test: ["CMD-SHELL", "pg_isready -U apbapp_user -d apbapp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped            # Se reinicia automáticamente si algo falla


  # ──────────────────────────────────────────
  # SERVICIO 2: Backend FastAPI
  # ──────────────────────────────────────────
  backend:
    container_name: apbapp_backend  # Nombre visible en Docker Desktop

    build:
      context: ./backend               # Carpeta donde está el Dockerfile
      dockerfile: Dockerfile
      target: development              # Usa el stage con hot-reload

    volumes:
      # Monta tu carpeta local → el contenedor ver tus cambios en tiempo real
      # Sin esto, tendrías que reconstruir la imagen cada vez que editas código
      - ./backend/app:/api/app

    environment:
      # La URL de la BD usa "db" como host (nombre del servicio de arriba)
      DATABASE_URL: postgresql://apbapp_user:apbapp_pass@db:5432/apbapp_db
      SECRET_KEY: dev-secret-key-cambia-esto-en-produccion
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ENVIRONMENT: development
      DEBUG: "true"

    ports:
      # Tu PC:8000 → contenedor:8000
      # Abre http://localhost:8000 en el navegador
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy     # Espera a que la BD esté lista antes de arrancar

    restart: unless-stopped


# ──────────────────────────────────────────
# VOLÚMENES con nombre (persisten entre reinicios)
# ──────────────────────────────────────────
volumes:
  pgdata:
    name: apbapp_pgdata
