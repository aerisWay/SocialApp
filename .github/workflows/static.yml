# Publica el frontend real (APBApp) en GitHub Pages como demo autónoma.
# Ensambla el sitio a partir de backend/app/static + deploy/demo.js,
# SIN modificar los archivos fuente de la app.
name: Deploy APBApp demo to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site for GitHub Pages
        run: |
          set -e
          rm -rf _site
          mkdir -p _site/static
          # 1) Copia la app real tal cual bajo /static (igual que la sirve el backend)
          cp -r backend/app/static/. _site/static/
          # 2) Añade la capa de modo demo (solo se activa en github.io)
          cp deploy/demo.js _site/static/js/demo.js
          # 3) index.html en la raíz: rutas absolutas /static/ -> relativas static/
          #    e inyecta demo.js justo antes de app.js
          sed -e 's#"/static/#"static/#g' \
              -e 's#<script src="static/js/app.js"></script>#<script src="static/js/demo.js"></script>\n  <script src="static/js/app.js"></script>#' \
              backend/app/static/index.html > _site/index.html
          # 4) SPA fallback: cualquier ruta desconocida sirve la app
          cp _site/index.html _site/404.html
          echo "---- _site/index.html (cabecera) ----"
          head -n 14 _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
